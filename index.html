<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scrum Poker</title>
    <style>
      :root {
        --bg: #1a1a1a;
        --surface: #242424;
        --surface-2: #2e2e2e;
        --border: #3a3a3a;
        --text: #f0f0f0;
        --text-secondary: #a0a0a0;
        --accent: #5b8def;
        --accent-bg: #223452;
      }
      * {
        box-sizing: border-box;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        padding: 2rem 1rem;
        display: flex;
        justify-content: center;
      }
      #app {
        width: 100%;
        max-width: 480px;
      }
      .still-voting-panel {
        width: 160px;
      }
      @media (min-width: 900px) {
        .still-voting-panel {
          position: fixed;
          top: 2rem;
          left: calc(50% + 260px);
        }
      }
      input,
      button {
        font-family: inherit;
        font-size: 15px;
      }
      input {
        width: 100%;
        padding: 10px 12px;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
      }
      button {
        padding: 10px 12px;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        cursor: pointer;
      }
      button:hover {
        background: var(--surface);
        border-color: #555;
      }
      button:active {
        transform: scale(0.98);
      }
      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      button:disabled:hover {
        background: var(--surface-2);
        border-color: var(--border);
      }
      button:disabled:active {
        transform: none;
      }
      @keyframes timer-flash {
        0%,
        100% {
          color: var(--text);
        }
        50% {
          color: #e2504f;
        }
      }
      .timer-flash {
        animation: timer-flash 0.6s ease-in-out 3;
      }
      @keyframes confetti-fall {
        0% {
          transform: translateY(0) rotate(0deg);
          opacity: 0.9;
        }
        100% {
          transform: translateY(100vh) rotate(360deg);
          opacity: 0;
        }
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1.5rem;
      }
      .label {
        font-size: 13px;
        color: var(--text-secondary);
        margin: 0 0 4px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

    <script>
      /* ====================================================================
   FIREBASE CONFIG — replace with your own project's config.
   Get this from: Firebase console > Project settings > Your apps > SDK setup
   Free tier (Spark plan) is plenty for this.
   ==================================================================== */
      const firebaseConfig = {
        apiKey: "",
        authDomain: "scrum-poker-46f29.firebaseapp.com",
        projectId: "scrum-poker-46f29",
        storageBucket: "scrum-poker-46f29.firebasestorage.app",
        messagingSenderId: "59363323998",
        appId: "1:59363323998:web:3813a1d1e404b17ba084cf",
        measurementId: "G-G4VN20JMQG",
        databaseURL: "https://scrum-poker-46f29-default-rtdb.firebaseio.com",
      };

      // Initialize Firebase
      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();

      const DECK = [".5", "1", "2", "3", "5", "8", "13", "?"];

      let state = {
        screen: "join",
        room: "",
        name: "",
        myVote: null,
        votes: {},
        revealed: false,
        roomRef: null,
        participants: {},
        timerEndsAt: null,
        timerPausedRemaining: null,
      };

      function sanitizeRoom(room) {
        return room
          .trim()
          .toLowerCase()
          .replace(/[^a-z0-9-]/g, "-");
      }

      function generateRoomCode() {
        const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // no O/0/I/1 ambiguity
        let code = "";
        for (let i = 0; i < 4; i++) {
          code += chars[Math.floor(Math.random() * chars.length)];
        }
        return code;
      }

      const SESSION_KEY = "scrum-poker-session";

      function saveSession(room, name, isHost) {
        try {
          localStorage.setItem(
            SESSION_KEY,
            JSON.stringify({ room, name, isHost }),
          );
        } catch (e) {
          console.error("Couldn't save session:", e);
        }
      }

      function loadSession() {
        try {
          const raw = localStorage.getItem(SESSION_KEY);
          return raw ? JSON.parse(raw) : null;
        } catch (e) {
          return null;
        }
      }

      function clearSession() {
        try {
          localStorage.removeItem(SESSION_KEY);
        } catch (e) {}
      }

      function getRoomFromUrl() {
        const params = new URLSearchParams(window.location.search);
        const room = params.get("room");
        return room ? sanitizeRoom(room).toUpperCase() : null;
      }

      function updateUrl(room) {
        const url = new URL(window.location.href);
        url.searchParams.set("room", room);
        window.history.replaceState({}, "", url);
      }

      function clearUrl() {
        const url = new URL(window.location.href);
        url.searchParams.delete("room");
        window.history.replaceState({}, "", url);
      }

      let connectionStatus = "checking"; // checking | connected | error

      function joinRoom(room, name, isHost, isNewRoom) {
        state.room = sanitizeRoom(room).toUpperCase();
        state.name = name.trim();
        state.myVote = null;
        state.isHost = !!isHost;
        state.screen = "room";

        if (state.roomRef) state.roomRef.off();
        state.roomRef = db.ref("rooms/" + state.room);

        if (isNewRoom) {
          state.roomRef.set({
            votes: {},
            revealed: false,
            createdAt: Date.now(),
          });
        }

        saveSession(state.room, state.name, state.isHost);
        updateUrl(state.room);

        // Presence: mark this participant as in the room, and auto-remove on disconnect
        const myParticipantRef = state.roomRef.child(
          "participants/" + state.name,
        );
        myParticipantRef.set(true);
        myParticipantRef.onDisconnect().remove();

        state.roomRef.on(
          "value",
          (snap) => {
            connectionStatus = "connected";
            const data = snap.val() || {};
            const wasRevealed = state.revealed;
            state.votes = data.votes || {};
            state.revealed = !!data.revealed;
            state.myVote = state.votes[state.name] || null;
            state.participants = data.participants || {};
            state.timerEndsAt = data.timerEndsAt || null;
            state.timerPausedRemaining =
              data.timerPausedRemaining != null
                ? data.timerPausedRemaining
                : null;
            render();
            if (!wasRevealed && state.revealed && isUnanimous(state.votes)) {
              celebrate();
            }
          },
          (err) => {
            connectionStatus = "error";
            console.error("Firebase error:", err);
            render();
          },
        );

        render();
      }

      function leaveRoom() {
        if (state.roomRef) {
          state.roomRef.child("participants/" + state.name).remove();
          state.roomRef.off();
        }
        clearSession();
        clearUrl();
        state = {
          screen: "join",
          room: "",
          name: "",
          myVote: null,
          votes: {},
          revealed: false,
          roomRef: null,
          participants: {},
          timerEndsAt: null,
          timerPausedRemaining: null,
        };
        render();
      }

      function formatTime(ms) {
        const totalSeconds = Math.max(0, Math.ceil(ms / 1000));
        const mins = Math.floor(totalSeconds / 60);
        const secs = totalSeconds % 60;
        return mins + ":" + String(secs).padStart(2, "0");
      }

      function isUnanimous(votes) {
        const vals = Object.values(votes);
        if (vals.length < 2) return false;
        return vals.every((v) => v === vals[0]);
      }

      function celebrate() {
        const colors = ["#5b8def", "#9dc0ff", "#f0f0f0", "#a0a0a0"];
        const container = document.createElement("div");
        container.style.cssText =
          "position:fixed; inset:0; pointer-events:none; z-index:9999; overflow:hidden;";
        document.body.appendChild(container);

        for (let i = 0; i < 60; i++) {
          const piece = document.createElement("div");
          const size = 6 + Math.random() * 6;
          const left = Math.random() * 100;
          const duration = 1.6 + Math.random() * 1.2;
          const delay = Math.random() * 0.3;
          const color = colors[Math.floor(Math.random() * colors.length)];
          const rotate = Math.random() * 360;
          piece.style.cssText = `
            position:absolute; top:-20px; left:${left}vw;
            width:${size}px; height:${size * 0.6}px;
            background:${color}; opacity:0.9;
            transform: rotate(${rotate}deg);
            animation: confetti-fall ${duration}s ease-in ${delay}s forwards;
          `;
          container.appendChild(piece);
        }

        setTimeout(() => {
          container.remove();
        }, 3200);
      }

      function castVote(val) {
        if (state.revealed) return;
        state.myVote = val;
        state.roomRef.child("votes/" + state.name).set(val);
      }

      function revealVotes() {
        const updates = { revealed: true };
        if (state.timerEndsAt) {
          const remainingMs = Math.max(0, state.timerEndsAt - Date.now());
          updates.timerEndsAt = null;
          updates.timerPausedRemaining = remainingMs;
        }
        state.roomRef.update(updates);
      }

      function resetRound() {
        state.roomRef.update({
          votes: {},
          revealed: false,
          timerEndsAt: null,
          timerPausedRemaining: null,
        });
      }

      function startTimer() {
        state.roomRef.update({
          timerEndsAt: Date.now() + 60 * 1000,
          timerPausedRemaining: null,
        });
      }

      function avg() {
        const nums = Object.values(state.votes)
          .map((v) => parseFloat(v))
          .filter((v) => !isNaN(v));
        if (!nums.length) return null;
        return (nums.reduce((a, b) => a + b, 0) / nums.length).toFixed(1);
      }

      function render() {
        const app = document.getElementById("app");

        if (state.screen === "join") {
          const urlRoom = getRoomFromUrl();

          if (urlRoom) {
            app.innerHTML = `
      <div class="card">
        <p style="font-weight:600; font-size:18px; margin:0 0 4px;">Join room ${urlRoom}</p>
        <p style="font-size:13px; color:var(--text-secondary); margin:0 0 20px;">
          Enter your name to jump in.
        </p>
        <p class="label">Your name</p>
        <input id="name-input" placeholder="Your Name Here" style="margin-bottom:20px;" />
        <button id="join-btn" style="width:100%; font-weight:600;">Join room</button>
        <button id="different-room-btn" style="width:100%; margin-top:8px; font-size:13px;">Not your room? Enter a different code</button>
      </div>
    `;
            const nameInput = document.getElementById("name-input");
            const tryJoin = () => {
              if (nameInput.value.trim()) {
                joinRoom(urlRoom, nameInput.value, false, false);
              }
            };
            document.getElementById("join-btn").onclick = tryJoin;
            nameInput.onkeydown = (e) => {
              if (e.key === "Enter") tryJoin();
            };
            document.getElementById("different-room-btn").onclick = () => {
              clearUrl();
              render();
            };
            return;
          }

          app.innerHTML = `
      <div class="card" style="margin-bottom: 12px;">
        <p style="font-weight:600; font-size:18px; margin:0 0 4px;">Start a new session</p>
        <p style="font-size:13px; color:var(--text-secondary); margin:0 0 20px;">
          Generates a room code you can share with your team.
        </p>
        <p class="label">Your name</p>
        <input id="host-name-input" placeholder="Your Name Here" style="margin-bottom:20px;" />
        <button id="create-btn" style="width:100%; font-weight:600;">Create room</button>
      </div>

      <p style="text-align:center; margin:16px 0; color:var(--text-secondary); font-size:13px;">OR</p>

      <div class="card">
        <p style="font-weight:600; font-size:18px; margin:0 0 4px;">Join a session</p>
        <p style="font-size:13px; color:var(--text-secondary); margin:0 0 20px;">
          Got a room code from someone? Enter it here.
        </p>
        <p class="label">Room code</p>
        <input id="room-input" placeholder="7XQ2" style="margin-bottom:16px; text-transform: uppercase;" />
        <p class="label">Your name</p>
        <input id="name-input" placeholder="Your Name Here" style="margin-bottom:20px;" />
        <button id="join-btn" style="width:100%; font-weight:600;">Join room</button>
      </div>
    `;
          const hostNameInput = document.getElementById("host-name-input");
          const roomInput = document.getElementById("room-input");
          const nameInput = document.getElementById("name-input");

          const tryCreate = () => {
            if (hostNameInput.value.trim()) {
              joinRoom(generateRoomCode(), hostNameInput.value, true, true);
            }
          };
          document.getElementById("create-btn").onclick = tryCreate;
          hostNameInput.onkeydown = (e) => {
            if (e.key === "Enter") tryCreate();
          };

          const tryJoin = () => {
            if (roomInput.value.trim() && nameInput.value.trim()) {
              joinRoom(roomInput.value, nameInput.value, false, false);
            }
          };
          document.getElementById("join-btn").onclick = tryJoin;
          nameInput.onkeydown = (e) => {
            if (e.key === "Enter") tryJoin();
          };
          return;
        }

        const submitted = Object.keys(state.votes);
        const allParticipants = Object.keys(state.participants);
        const waitingOn = allParticipants.filter((n) => !submitted.includes(n));

        const waitingHtml =
          !state.revealed && waitingOn.length
            ? `<div class="card still-voting-panel">
        <p style="font-weight:600; font-size:14px; margin:0 0 8px;">Still voting</p>
        ${waitingOn
          .map(
            (name) =>
              `<div style="padding:6px 0; font-size:14px; color:var(--text-secondary);">${name}</div>`,
          )
          .join("")}
      </div>`
            : "";

        const timerHtml = state.timerEndsAt
          ? `<div id="timer-display" style="text-align:center; font-size:28px; font-weight:600; margin-bottom:12px; font-variant-numeric: tabular-nums;">1:00</div>`
          : state.timerPausedRemaining != null
            ? `<div style="text-align:center; margin-bottom:12px;">
        <div style="font-size:28px; font-weight:600; font-variant-numeric: tabular-nums; color: var(--text-secondary);">${formatTime(state.timerPausedRemaining)}</div>
        <div style="font-size:12px; color: var(--text-secondary);">Paused</div>
      </div>`
            : "";

        const deckHtml = DECK.map((v) => {
          const selected = state.myVote === v;
          return `<button data-val="${v}" class="card-btn" ${state.revealed ? "disabled" : ""} style="
      width:56px; height:76px; font-size:18px; font-weight:600; border-radius:10px;
      border:${selected ? "2px solid var(--accent)" : "1px solid var(--border)"};
      background:${selected ? "var(--accent-bg)" : "var(--surface-2)"};
      color:${selected ? "#9dc0ff" : "var(--text)"};
    ">${v}</button>`;
        }).join("");

        const votesHtml = submitted.length
          ? submitted
              .map((name) => {
                const val = state.votes[name];
                return `<div class="row" style="padding:8px 0; border-bottom:1px solid var(--border);">
          <span style="font-size:14px;">${name}${name === state.name ? " (you)" : ""}</span>
          <span style="font-size:14px; font-weight:600;">${state.revealed ? val : "✓"}</span>
        </div>`;
              })
              .join("")
          : `<p style="font-size:13px; color:var(--text-secondary); margin:0;">No one's voted yet.</p>`;

        const avgHtml = state.revealed
          ? isUnanimous(state.votes)
            ? `<div style="background: var(--accent-bg); border-radius:10px; padding:1rem; margin-top:16px; text-align:center;">
        <p style="font-size:13px; color:#9dc0ff; margin:0 0 4px;">Unanimous</p>
        <p style="font-size:24px; font-weight:600; margin:0; color:#9dc0ff;">Everyone said ${Object.values(state.votes)[0]}</p>
      </div>`
            : avg() !== null
              ? `<div style="background:var(--surface-2); border-radius:10px; padding:1rem; margin-top:16px; text-align:center;">
        <p class="label" style="margin-bottom:4px;">Average</p>
        <p style="font-size:24px; font-weight:600; margin:0;">${avg()}</p>
      </div>`
              : ""
          : "";

        const statusBanner =
          connectionStatus === "error"
            ? `<div style="background:#4a1e1e; border:1px solid #7a2e2e; border-radius:8px; padding:10px 12px; margin-bottom:16px; font-size:13px; color:#ff9d9d;">
                Can't reach the database. Check your Firebase config and rules.
              </div>`
            : connectionStatus === "checking"
              ? `<div style="background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:10px 12px; margin-bottom:16px; font-size:13px; color:var(--text-secondary);">
                Connecting…
              </div>`
              : "";

        app.innerHTML = `
    ${statusBanner}
    <div class="row" style="margin-bottom:16px;">
      <div>
        <p class="label" style="margin:0;">Room code${state.isHost ? " (share this)" : ""}</p>
        <div style="display:flex; align-items:center; gap:8px;">
          <p style="font-weight:600; font-size:20px; margin:0; letter-spacing: 1px;">${state.room}</p>
          <button id="copy-btn" style="padding:4px 8px; font-size:12px;">Copy link</button>
        </div>
      </div>
      <span style="font-size:13px; color:var(--text-secondary);">${state.name}</span>
    </div>

    <div style="text-align:right; margin-bottom:8px;">
      <button id="leave-btn" style="padding:4px 8px; font-size:12px;">Leave room</button>
    </div>

    ${timerHtml}

    <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:20px;">
      ${deckHtml}
    </div>

    ${
      state.isHost && !state.timerEndsAt && state.timerPausedRemaining == null
        ? `<div style="text-align:center; margin-bottom:20px;">
      <button id="start-timer-btn" style="font-size:13px; padding:6px 12px;">Start 1 min timer</button>
    </div>`
        : ""
    }

    <div class="card" style="margin-bottom:16px;">
      <p style="font-weight:600; font-size:14px; margin:0 0 8px;">Votes (${submitted.length})</p>
      ${votesHtml}
      ${avgHtml}
    </div>

    ${waitingHtml}

    <div style="display:flex; gap:8px;">
      ${
        state.revealed
          ? `<button id="new-round-btn" style="flex:1;">New round</button>`
          : `<button id="reveal-btn" style="flex:1;" ${submitted.length === 0 ? "disabled" : ""}>Reveal</button>`
      }
      <button id="delete-btn" style="flex:1; color: var(--text-secondary); font-size:13px;">Delete estimates</button>
    </div>
  `;

        document.querySelectorAll(".card-btn").forEach((btn) => {
          btn.onclick = () => castVote(btn.dataset.val);
        });
        if (state.isHost && document.getElementById("start-timer-btn")) {
          document.getElementById("start-timer-btn").onclick = startTimer;
        }
        if (state.revealed) {
          document.getElementById("new-round-btn").onclick = resetRound;
        } else if (submitted.length > 0) {
          document.getElementById("reveal-btn").onclick = revealVotes;
        }
        document.getElementById("delete-btn").onclick = () => {
          if (confirm("Delete all estimates for this round?")) {
            resetRound();
          }
        };
        document.getElementById("copy-btn").onclick = () => {
          navigator.clipboard.writeText(window.location.href).then(() => {
            const btn = document.getElementById("copy-btn");
            btn.textContent = "Copied";
            setTimeout(() => {
              btn.textContent = "Copy link";
            }, 1500);
          });
        };
        document.getElementById("leave-btn").onclick = leaveRoom;

        if (window.__timerInterval) {
          clearInterval(window.__timerInterval);
          window.__timerInterval = null;
        }
        if (state.timerEndsAt) {
          const tick = () => {
            const el = document.getElementById("timer-display");
            if (!el) {
              clearInterval(window.__timerInterval);
              return;
            }
            const remainingMs = state.timerEndsAt - Date.now();
            if (remainingMs <= 0) {
              el.textContent = "0:00";
              el.classList.add("timer-flash");
              clearInterval(window.__timerInterval);
              return;
            }
            el.textContent = formatTime(remainingMs);
          };
          tick();
          window.__timerInterval = setInterval(tick, 250);
        }
      }

      const urlRoomOnLoad = getRoomFromUrl();
      const savedSession = loadSession();

      if (
        urlRoomOnLoad &&
        savedSession &&
        savedSession.room === urlRoomOnLoad
      ) {
        // Same room in URL and saved session — reconnect with known name/host status
        joinRoom(
          savedSession.room,
          savedSession.name,
          savedSession.isHost,
          false,
        );
      } else if (urlRoomOnLoad) {
        // URL has a room but no matching session — show name entry for that room
        render();
      } else if (savedSession && savedSession.room && savedSession.name) {
        // No URL room, fall back to saved session
        joinRoom(
          savedSession.room,
          savedSession.name,
          savedSession.isHost,
          false,
        );
      } else {
        render();
      }
    </script>
  </body>
</html>
